name: mobile_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  flutter_dotenv: ^6.0.1
  go_router: ^17.4.0
  provider: ^6.1.5+1
  http: ^1.6.0
  google_fonts: ^8.2.1
  flutter_lucide: ^1.11.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true

  assets:
    - .env



flutter_launcher_icons:
